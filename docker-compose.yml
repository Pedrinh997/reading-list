services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: reading
      POSTGRES_PASSWORD: senha-forte-123
      POSTGRES_DB: readingdb
    ports:
    - 5434:5432
    volumes:
    - readingdb_data:/var/lib/postgresql/data
    - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U reading -d readingdb
      interval: 5s
      timeout: 3s
      retries: 10
    command:
    - postgres
    - -c
    - synchronous_commit=off
  redis:
    image: redis:7-alpine
    ports:
    - 6380:6379
    volumes:
    - redisdata:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
    - 8001:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://reading:senha-forte-123@db:5432/readingdb
      REDIS_HOST: redis
      REDIS_PORT: 6379
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/docs',
        timeout=2).status==200 else 1)"
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 15s
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://reading:senha-forte-123@db:5432/readingdb
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    depends_on:
    - api
    ports:
    - 8003:80
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.55.0
    depends_on:
    - api
    ports:
    - 9091:9090
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
volumes:
  readingdb_data: null
  redisdata: null
